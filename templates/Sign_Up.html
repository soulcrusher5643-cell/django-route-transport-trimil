{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6 col-xl-5">
            <div class="card card-auth p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="auth-header-icon mb-3">
                        📝
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Create an Account</h3>
                    <p class="text-muted small">Join TransitHub for seamless route & courier booking</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-sm-8">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
                        </div>
                        
                        <div class="col-sm-4">
                            <label for="age" class="form-label">Age</label>
                            <input type="number" class="form-control" id="age" name="age" placeholder="25" min="1" max="120" required>
                        </div>

                        <div class="col-12">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Choose a unique username" required>
                        </div>

                        <div class="col-12">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Create a secure password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-gradient w-100 py-2.5 mt-4 mb-3 fs-6">Register Account ➔</button>
                </form>

                <div class="text-center auth-footer-text mt-3">
                    Already have an account? <a href="{% url 'Sign_In' %}">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
