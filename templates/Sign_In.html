{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <div class="card card-auth p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="auth-header-icon mb-3">
                        🔑
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to your TransitHub account</p>
                </div>

                {% if error %}
                    <div class="alert alert-danger border-0 small text-center mb-4 py-2" role="alert">
                        ⚠️ {{ error }}
                    </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary-gradient w-100 py-2.5 mb-3 fs-6">Sign In ➔</button>
                </form>

                <div class="text-center auth-footer-text mt-3">
                    Don't have an account? <a href="{% url 'Sign_Up' %}">Register Now</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
